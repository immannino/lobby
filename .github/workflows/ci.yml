name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^_legacy/'))" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        run: |
          go test -run '^$' -fuzz FuzzHTTPJoin -fuzztime 20s .
          go test -run '^$' -fuzz FuzzMessageDecode -fuzztime 20s .
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  bench:
    # Compares benchmarks against the base branch on pull requests. Results
    # are printed in the job log; they don't fail the build (shared CI
    # runners are too noisy for a hard gate).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: benchmark head
        run: go test -run '^$' -bench . -benchmem -count 6 . | tee /tmp/head.txt
      - name: benchmark base
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          go test -run '^$' -bench . -benchmem -count 6 . | tee /tmp/base.txt || true
      - name: compare
        run: go run golang.org/x/perf/cmd/benchstat@latest /tmp/base.txt /tmp/head.txt
