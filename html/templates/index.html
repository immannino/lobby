{{ define "index" }}
    {{ template "top" }}
    <main>
        <h1>Home</h1>
        <p>Create or Join a session</p>
        <form>
            <label for="Code">Code</label>
            <input id="Code" name="Code" type="text" maxlength="4">

            <label for="Name">Name</label>
            <input id="Name" name="Name" type="text" maxlength="20" required>

            <input type="submit" value="Join" hx-post="/join" hx-trigger="click">
            <input type="submit" value="Create" hx-post="/create" hx-trigger="click">
        </form>
    </main>
    {{ template "bottom" }}
{{ end }}
