<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Play · lobby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/immannino/yearn.css@0.1.0/dist/yearn.min.css">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/demo.css">
</head>
<body>
<header>
  <nav>
    <a href="/"><strong>lobby</strong></a>
    <ul>
      <li><a href="/play" aria-current="page">Play</a></li>
      <li><a href="/docs">Docs</a></li>
      <li><a href="https://github.com/immannino/lobby">GitHub</a></li>
    </ul>
  </nav>
  <hgroup>
    <p>Live demo</p>
    <h1>Play</h1>
    <p>Open a room on the big screen, then join from your phone with the code.</p>
  </hgroup>
</header>

<main>
  <section>
    <article data-recent hidden>
      <h2>Your recent rooms</h2>
      <ul data-recent-list></ul>
      <footer><button type="button" data-clear-history>Clear history</button></footer>
    </article>

    <article>
      <h2>Join a room</h2>
      <form id="join">
        <label for="join-code">Room code</label>
        <input id="join-code" name="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        <label for="join-name">Your name</label>
        <input id="join-name" name="name" maxlength="20" autocomplete="nickname" required>
        <div><button>Join</button></div>
        <p role="alert"></p>
      </form>
    </article>

    <article>
      <h2>Start a room</h2>
      <form id="create">
        <label for="create-game">Game</label>
        <select id="create-game" name="game">
          <option value="tictactoe">Tic-tac-toe</option>
        </select>
        <small data-blurb></small>
        <label for="create-name">Your name</label>
        <input id="create-name" name="name" maxlength="20" autocomplete="nickname" required>
        <div>
          <button>Create and play</button>
          <button type="button" data-display>Host on this screen</button>
        </div>
        <p role="alert"></p>
      </form>
    </article>
  </section>
</main>

<footer>
  <nav data-themes aria-label="Theme"></nav>
</footer>

<script type="module">
  import { createRoom, joinRoom } from "/api/client.js";
  import * as history from "/static/history.js";

  // Fill the game picker from the server's registry.
  const games = await fetch("/api/games").then((r) => r.json()).catch(() => []);
  {
    const select = document.getElementById("create-game");
    const blurb = document.querySelector("[data-blurb]");
    if (games.length) select.replaceChildren(...games.map((g) => Object.assign(document.createElement("option"), { value: g.name, textContent: g.title })));
    const show = () => (blurb.textContent = games.find((g) => g.name === select.value)?.blurb ?? "");
    select.onchange = show;
    show();
  }
  const gameTitle = (name) => games.find((g) => g.name === name)?.title ?? name ?? "Game";

  const params = new URLSearchParams(location.search);
  const join = document.getElementById("join");
  const create = document.getElementById("create");

  if (params.get("code")) join.elements.code.value = params.get("code");
  if (params.get("msg")) join.querySelector("[role=alert]").textContent = params.get("msg");
  (params.get("code") ? join.elements.name : join.elements.code).focus();

  async function go(form, btn, action) {
    const err = form.querySelector("[role=alert]");
    err.textContent = "";
    btn.disabled = true;
    try {
      const res = await action();
      location.href = `/r/${res.code}`;
    } catch (e) {
      err.textContent = e.message.charAt(0).toUpperCase() + e.message.slice(1);
      btn.disabled = false;
    }
  }

  // ---- Recent rooms (this browser only; see /static/history.js) ----

  // One-click rejoin. With a valid seat cookie the room page just works;
  // if the seat expired it sends us back here with ?rejoin=1 and we take a
  // new seat under the same name (or as the big screen again).
  function rejoinRequest(entry) {
    return entry.role === "display" ? { role: "display" } : { name: entry.name };
  }

  const agoFormat = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  function ago(t) {
    const mins = Math.round((t - Date.now()) / 60000);
    return Math.abs(mins) < 60 ? agoFormat.format(mins, "minute") : agoFormat.format(Math.round(mins / 60), "hour");
  }

  async function renderRecent() {
    const card = document.querySelector("[data-recent]");
    const list = document.querySelector("[data-recent-list]");
    const entries = history.load();
    card.hidden = entries.length === 0;
    if (!entries.length) return;

    list.replaceChildren(
      ...entries.map((e) => {
        const li = document.createElement("li");
        li.dataset.entry = e.code;
        const code = Object.assign(document.createElement("strong"), { textContent: e.code });
        code.dataset.code = "";
        const who = e.role === "display" ? "as the big screen" : `as ${e.name}`;
        const meta = Object.assign(document.createElement("span"), { textContent: `${gameTitle(e.game)} · ${who} · ${ago(e.at)}` });
        meta.dataset.meta = "";
        const btn = Object.assign(document.createElement("button"), { type: "button", textContent: "Rejoin", disabled: true });
        btn.onclick = () => (location.href = `/r/${e.code}`);
        li.append(code, meta, btn);
        // Is the room still open? (Rooms close when everyone leaves or after
        // a while with nobody connected.)
        fetch(`/api/rooms/${e.code}`).then(async (res) => {
          if (res.ok) {
            const info = await res.json();
            btn.disabled = false;
            meta.textContent += ` · ${info.players} ${info.players === 1 ? "player" : "players"}`;
          } else if (res.status === 404) {
            li.dataset.ended = "";
            btn.textContent = "Ended";
          }
        }).catch(() => {});
        return li;
      }),
    );
  }
  document.querySelector("[data-clear-history]").onclick = () => {
    history.clear();
    renderRecent();
  };
  renderRecent();

  // Back from a room whose seat expired: rejoin automatically, but only for
  // rooms in this browser's history (so a crafted link can't join you
  // anywhere you haven't been).
  const rejoinEntry = params.get("rejoin") && history.find((params.get("code") ?? "").toUpperCase());
  if (rejoinEntry) {
    const alert = join.querySelector("[role=alert]");
    alert.textContent = "Your seat expired. Rejoining…";
    if (rejoinEntry.name) join.elements.name.value = rejoinEntry.name;
    joinRoom("/api", rejoinEntry.code, rejoinRequest(rejoinEntry))
      .then((res) => (location.href = `/r/${res.code}`))
      .catch((e) => {
        alert.textContent = `Couldn't rejoin: ${e.message}`;
        if (e.message.includes("not found")) history.forget(rejoinEntry.code);
        renderRecent();
      });
  }

  join.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const { code, name } = Object.fromEntries(new FormData(join));
    go(join, ev.submitter ?? join.querySelector("button"), () => joinRoom("/api", code, { name }));
  });
  create.addEventListener("submit", (ev) => {
    ev.preventDefault();
    go(create, ev.submitter ?? create.querySelector("button"), () => createRoom("/api", { name: create.elements.name.value, game: create.elements.game.value }));
  });
  create.querySelector("[data-display]").addEventListener("click", (ev) => {
    go(create, ev.currentTarget, () => createRoom("/api", { role: "display", game: create.elements.game.value }));
  });
</script>
</body>
</html>
